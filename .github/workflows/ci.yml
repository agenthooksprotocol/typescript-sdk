name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          path: typescript-sdk
      - name: Check out shared protocol fixtures
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 6efb34f8a3da9c174d69edc8e41a62e1ee60ee71
          path: agent-hooks-protocol
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: pnpm check
