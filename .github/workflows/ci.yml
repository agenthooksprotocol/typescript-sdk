name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: pnpm check
