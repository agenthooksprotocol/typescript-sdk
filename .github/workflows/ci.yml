name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-sdk
    steps:
      - uses: actions/checkout@v5
        with:
          path: typescript-sdk
      - name: Check out shared protocol fixtures
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: 1d98c19bf4558d998ef8af32b2ac54f604899c20
          path: agent-hooks-protocol
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: pnpm check
